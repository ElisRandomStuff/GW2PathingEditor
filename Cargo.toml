[package]
name = "pathing_editor"
version = "0.1.0"
edition = "2024"
authors = ["Eli"]
description = "Create and edit GW2 marker packs (TacO / Blish HUD Pathing / TaimiHUD) in game. Raidcore Nexus addon."
license = "MIT"
repository = "https://github.com/ElisRandomStuff/GW2PathingEditor"
publish = false

[lib]
# Nexus addons are DLLs. Unit tests still build and run on the host (Linux).
crate-type = ["cdylib"]

[dependencies]
getrandom = "0.3"
roxmltree = "0.20"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# The addon glue only exists on Windows. Everything else (pack logic, XML) is plain Rust
# and is unit-tested on the host with `cargo test`.
[target.'cfg(windows)'.dependencies]
nexus = { git = "https://github.com/zerthox/nexus-rs", tag = "0.12.0", features = ["mumble"] }

[profile.release]
lto = "thin"
strip = true
